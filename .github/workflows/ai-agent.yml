name: AI Agent

on:
  issues:
    types: [opened, labeled, reopened]
  pull_request:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: false
        type: number
      pr_number:
        description: "PR number to review"
        required: false
        type: number

env:
  BUN_VERSION: 1.4.2

jobs:
  setup:
    name: Setup Agent Environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      event: ${{ github.event_name }}
      issue_number: ${{ github.event.issue.number || inputs.issue_number || '' }}
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --no-verify

      - name: Build SDK
        run: bun run build:sdk

      - name: Print event context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Issue: ${{ github.event.issue.number || inputs.issue_number || 'none' }}"
          echo "PR: ${{ github.event.pull_request.number || inputs.pr_number || 'none' }}"

  agent:
    name: Run AI Agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --no-verify

      - name: Build SDK
        run: bun run build:sdk

      - name: Run AI agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "AI agent environment ready for issue ${{ needs.setup.outputs.issue_number }} and PR ${{ needs.setup.outputs.pr_number }}"
