name: AI Agent

on:
  issues:
    types: [opened, labeled, reopened]
  pull_request:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: false
        type: number
      pr_number:
        description: "PR number to review"
        required: false
        type: number

env:
  BUN_VERSION: 1.4.4

jobs:
  agent:
    name: Run AI Agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --no-verify

      - name: Build SDK
        run: bun run build:sdk

      - name: Get issue/PR context
        id: context
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
            echo "body=${{ github.event.issue.body }}" >> $GITHUB_OUTPUT
            echo "type=issue" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
            echo "body=${{ github.event.pull_request.body }}" >> $GITHUB_OUTPUT
            echo "type=pr" >> $GITHUB_OUTPUT
          else
            echo "number=${{ inputs.issue_number || inputs.pr_number || 0 }}" >> $GITHUB_OUTPUT
            echo "title=manual" >> $GITHUB_OUTPUT
            echo "body=" >> $GITHUB_OUTPUT
            echo "type=manual" >> $GITHUB_OUTPUT
          fi

      - name: Run AI agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun run cli "Fix issue #${{ steps.context.outputs.number }}: ${{ steps.context.outputs.title }}

          ${{ steps.context.outputs.body }}

          Repository context: This is the Cline monorepo. Build with bun run build:sdk. Lint with bun run lint. Typecheck with bun run types. Test with bun run test.

          Make the necessary code changes to fix the issue, then verify with lint and typecheck."
