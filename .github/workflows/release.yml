name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  BUN_VERSION: 1.4.2

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --no-verify

      - name: Build SDK
        run: bun run build:sdk

      - name: Build VS Code extension
        run: bun esbuild.mjs --production

      - name: Build apps
        run: bun run build:apps

      - name: Run release
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VS_CODE_MARKETPLACE_TOKEN: ${{ secrets.VS_CODE_MARKETPLACE_TOKEN }}
        run: bun run release
