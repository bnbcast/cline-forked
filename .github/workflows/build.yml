name: Build Cline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install

      - name: Build SDK
        run: bun run build:sdk

      - name: Build VS Code extension
        run: bun -F @cline/vscode run build:production

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cline-vsix
          path: apps/vscode/dist/*.vsix